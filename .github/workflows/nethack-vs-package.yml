name: Build NetHack-cn pre-release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nethack-vs-package-${{ github.ref }}
  cancel-in-progress: true

env:
  SOLUTION_PATH: sys/windows/vs/NetHack.sln
  BUILD_CONFIGURATION: Release
  BUILD_PLATFORM: x64
  PACKAGE_DIR: vspackage
  # Shared recipe for the Linux container builds (build-linux job).
  # The game is compiled with a relative HACKDIR and a relative sysconf
  # path, so after extraction everything is resolved from the launcher's
  # own location and the tarball can be unpacked anywhere.
  #   glibc  -> dynamic build against glibc (debian:12), needs ncurses at runtime
  #   musl   -> dynamic build against musl (alpine:3.20), needs ncurses at runtime
  #   static -> static build against glibc (debian:12), no runtime deps
  LINUX_BUILD_SCRIPT: |
    set -eu

    if command -v apt-get >/dev/null 2>&1; then
      apt-get update -qq
      DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
        build-essential groff libncurses-dev pkg-config curl ca-certificates git
    else
      # musl only: musl-dev does not ship the kernel UAPI headers
      # (sys/vt.h in unixtty.c needs linux/vt.h from linux-headers)
      apk add --no-cache build-base groff ncurses-dev pkgconf curl ca-certificates git coreutils linux-headers
    fi

    git config --global --add safe.directory /src

    cd sys/unix
    sh setup.sh hints/linux.500
    cd ../..
    make fetch-lua
    # keep the sysconf lookup relative (see comment above)
    sed -i 's|-DSYSCF_FILE=\\"$(HACKDIR)/sysconf\\"|-DSYSCF_FILE=\\"sysconf\\"|' Makefile

    EXTRA_ARGS=""
    CCFLAGS_VALUE="-O2 -D_GNU_SOURCE"
    if [ "$VARIANT_LIBC" = "musl" ]; then
      EXTRA_ARGS="$EXTRA_ARGS MUSL=1"
      # musl has no __sighandler_t; the hints' ifndef-MUSL guard for
      # -DSIG_RET_TYPE=__sighandler_t doesn't take effect in this setup,
      # so disable signal handling on musl instead
      CCFLAGS_VALUE="$CCFLAGS_VALUE -DNO_SIGNAL"
    fi
    if [ "$VARIANT_LIBC" = "static" ]; then
      EXTRA_ARGS="$EXTRA_ARGS LFLAGS=-static"
    fi
    make GIT=1 NO_NHUUID=1 CCFLAGS="$CCFLAGS_VALUE" COLCMD=cat \
      NROFF_FLAGS=-Tutf8 \
      WANT_WIN_TTY=1 WANT_WIN_CURSES=1 HACKDIR=. $EXTRA_ARGS all

    STAGE="$PWD/stage/NetHack-cn"
    make install \
      HACKDIR="$STAGE/nethackdir" INSTDIR="$STAGE/nethackdir" \
      VARDIR="$STAGE/nethackdir" SHELLDIR="$STAGE/bin"

    strip "$STAGE/nethackdir/nethack" "$STAGE/nethackdir/recover"
    # rewrite the launcher so it finds the game dir next to itself
    sed -i 's|^HACKDIR=.*|HACKDIR=$(CDPATH= cd -- "$(dirname -- "$0")/../nethackdir" \&\& pwd)|' \
      "$STAGE/bin/nethack"

    mkdir -p "$STAGE/doc"
    cp -f doc/Guidebook "$STAGE/doc/" 2>/dev/null || true
    # VARIANT_ORTHO selects which orthography variant (s/t/tg/twp) the
    # sources were converted to on the runner before entering the container;
    # it only affects the tarball name.
    tar -czf "NetHack-cn-linux-$VARIANT_ARCH-$VARIANT_LIBC-$VARIANT_ORTHO.tar.gz" -C stage NetHack-cn

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        orthography: [s, t, tg, twp]
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Set up OpenCC
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo BYVoid/OpenCC --pattern "*windows*.zip" --dir ./opencc
          unzip ./opencc/*windows*.zip -d ./opencc

      - name: Set up General Standard Traditional (opencc-tonggui)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo amorphobia/opencc-tonggui --pattern "*tonggui*.zip" --dir ./opencc-tonggui
          unzip ./opencc-tonggui/*tonggui*.zip -d ./opencc-tonggui

      - name: Get All Kanji Files
        shell: bash
        run: |
          python ./.github/workflows/findkanjifiles.py

      - name: Orthographic Convert
        shell: bash
        run: |
          if [ "${{ matrix.orthography }}" = "s" ]; then
            echo "Original, skip converting"
          elif [ "${{ matrix.orthography }}" = "tg" ]; then
            echo "Using orthography: ${{ matrix.orthography }}"
            cat ./kanjifiles.txt
            cat ./kanjifiles.txt | tr -d '\r' | while read -r file; do
              echo "Converting: $file"
              ./opencc/bin/opencc.exe -c "./opencc-tonggui/opencc/s2tg.json" -i "$file" -o "$file" --in-place
            done
          else
            echo "Using orthography: ${{ matrix.orthography }}"
            cat ./kanjifiles.txt
            cat ./kanjifiles.txt | tr -d '\r' | while read -r file; do
              echo "Converting: $file"
              ./opencc/bin/opencc.exe -c "s2${{ matrix.orthography }}.json" -i "$file" -o "$file" --in-place
            done
          fi

      - name: Package (Converted) Source Code
        shell: bash
        run: |
          mkdir -p "$PACKAGE_DIR"
          7z a "$PACKAGE_DIR/NetHack-cn-src-${{ matrix.orthography }}.zip" . '-xr!.git' '-xr!.github' '-xr!opencc' '-xr!opencc-tonggui' '-xr!vspackage'

      - name: Build Visual Studio solution
        env:
          CL: "/utf-8"
        run: |
          msbuild $env:SOLUTION_PATH /m /p:Configuration=$env:BUILD_CONFIGURATION /p:Platform=$env:BUILD_PLATFORM /t:Build

      - name: Rename packaged artifacts
        run: |
          Get-ChildItem -Path $env:PACKAGE_DIR -Filter *.zip | Where-Object { $_.Name -notlike "NetHack-cn-src-*" } | ForEach-Object {
            $newName = "$($_.BaseName)-${{ matrix.orthography }}$($_.Extension)"
            Rename-Item -Path $_.FullName -NewName $newName
          }

      - name: Verify packaged artifacts
        run: |
          $packages = Get-ChildItem -Path $env:PACKAGE_DIR -Filter *.zip -File -ErrorAction Stop
          $packages | Select-Object Name, Length, LastWriteTime | Format-Table -AutoSize

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: nethack-vspackage-x64-${{ matrix.orthography }}
          path: vspackage/*.zip
          if-no-files-found: error

  build-linux:
    name: linux-${{ matrix.arch }}-${{ matrix.libc }}-${{ matrix.orthography }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        # amd64 / i386 build natively in 32-bit-capable containers on x86_64
        # runners; arm64 uses the free public-repo arm64 runner natively.
        # glibc and static builds use debian:12 (gcc), musl builds use
        # alpine:3.20 (derived from matrix.libc in the docker step below).
        orthography: [s, t, tg, twp]
        arch: [amd64, i386, arm64]
        libc: [glibc, musl, static]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Set up OpenCC
        if: matrix.orthography != 's'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq opencc

      - name: Set up General Standard Traditional (opencc-tonggui)
        if: matrix.orthography == 'tg'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo amorphobia/opencc-tonggui --pattern "*tonggui*.zip" --dir ./opencc-tonggui
          unzip ./opencc-tonggui/*tonggui*.zip -d ./opencc-tonggui

      - name: Get All Kanji Files
        if: matrix.orthography != 's'
        run: python3 ./.github/workflows/findkanjifiles.py

      - name: Orthographic Convert
        if: matrix.orthography != 's'
        shell: bash
        run: |
          if [ "${{ matrix.orthography }}" = "tg" ]; then
            CONFIG="./opencc-tonggui/opencc/s2tg.json"
          else
            CONFIG="/usr/share/opencc/s2${{ matrix.orthography }}.json"
          fi
          echo "Using orthography: ${{ matrix.orthography }} ($CONFIG)"
          cat ./kanjifiles.txt
          cat ./kanjifiles.txt | tr -d '\r' | while read -r file; do
            echo "Converting: $file"
            # distro opencc has no --in-place; write to a temp file first
            opencc -c "$CONFIG" -i "$file" -o "$file.converted" \
              && mv -f "$file.converted" "$file"
          done

      - name: Build NetHack in ${{ matrix.libc == 'musl' && 'alpine:3.20' || 'debian:12' }} container
        run: |
          docker run --rm --platform linux/${{ matrix.arch }} \
            -v "${{ github.workspace }}:/src" -w /src \
            -e VARIANT_ARCH=${{ matrix.arch }} \
            -e VARIANT_LIBC=${{ matrix.libc }} \
            -e VARIANT_ORTHO=${{ matrix.orthography }} \
            ${{ matrix.libc == 'musl' && 'alpine:3.20' || 'debian:12' }} /bin/sh -euc "$LINUX_BUILD_SCRIPT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: nethack-linux-${{ matrix.arch }}-${{ matrix.libc }}-${{ matrix.orthography }}
          path: NetHack-cn-linux-*.tar.gz
          if-no-files-found: error

  build-macos:
    name: macos-arm64
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Install groff
        run: brew install groff

      - name: Build NetHack
        run: |
          cd sys/unix
          sh setup.sh hints/macOS.500
          cd ../..
          make fetch-lua
          # keep the sysconf lookup relative so the app bundle-free zip
          # can be unpacked anywhere
          sed -i '' 's|-DSYSCF_FILE=\\"$(HACKDIR)/sysconf\\"|-DSYSCF_FILE=\\"sysconf\\"|' Makefile
          # USEMACPORTS=1 only disables the hints' homebrew/ncurses detection,
          # so we link the system ncurses instead of an unlinked brew keg
          # (which would create a dyld dependency ordinary Macs cannot satisfy)
          make GIT=1 CCFLAGS=-O2 USEMACPORTS=1 COLCMD=cat NROFF_FLAGS=-Tutf8 \
            WANT_WIN_TTY=1 WANT_WIN_CURSES=1 HACKDIR=. all

      - name: Stage and package
        run: |
          STAGE="$PWD/stage/NetHack-cn"
          make install \
            HACKDIR="$STAGE/nethackdir" INSTDIR="$STAGE/nethackdir" \
            VARDIR="$STAGE/nethackdir" SHELLDIR="$STAGE/bin"

          strip "$STAGE/nethackdir/nethack" "$STAGE/nethackdir/recover"
          sed -i '' 's|^HACKDIR=.*|HACKDIR=$(CDPATH= cd -- "$(dirname -- "$0")/../nethackdir" \&\& pwd)|' \
            "$STAGE/bin/nethack"

          mkdir -p "$STAGE/doc"
          cp -f doc/Guidebook "$STAGE/doc/" 2>/dev/null || true

          ( cd stage && zip -ry "$GITHUB_WORKSPACE/NetHack-cn-macos-arm64.zip" NetHack-cn )

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: nethack-macos-arm64
          path: NetHack-cn-macos-arm64.zip
          if-no-files-found: error

  release:
    needs: [build, build-linux, build-macos]
    # publish whatever builds succeeded; don't require every matrix leg to pass
    # (!cancelled(), not always(): a run superseded by concurrency cancellation
    # must not publish a release)
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) }}
    runs-on: ubuntu-latest

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: nethack-*
          path: release-assets
          merge-multiple: true

      - name: Check for any successful build
        id: have-assets
        shell: bash
        run: |
          shopt -s nullglob
          files=(release-assets/*.zip release-assets/*.tar.gz release-assets/**/*.zip release-assets/**/*.tar.gz)
          echo "Found ${#files[@]} artifact files"
          if [ ${#files[@]} -eq 0 ]; then
            echo "No artifacts from any build job - nothing to release"
          fi
          echo "ok=$([ ${#files[@]} -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Prepare release metadata
        id: meta
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::7}"
          tag="nethack-pre-${GITHUB_RUN_NUMBER}-${short_sha}"
          name="NetHack prerelease ${GITHUB_RUN_NUMBER} (${short_sha})"
          {
            echo "tag=$tag"
            echo "name=$name"
          } >> "$GITHUB_OUTPUT"

      - name: Publish prerelease
        if: steps.have-assets.outputs.ok == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: true
          files: |
            release-assets/*.zip
            release-assets/**/*.zip
            release-assets/*.tar.gz
            release-assets/**/*.tar.gz
          body: |
            Automated NetHack package build.

            - Branch: `${{ github.ref_name }}`
            - Commit: `${{ github.sha }}`
